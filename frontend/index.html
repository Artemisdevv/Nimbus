<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/editor.css">
    <link rel="stylesheet" href="styles/download.css">
    <link rel="stylesheet" href="styles/queue.css">
    <link rel="stylesheet" href="styles/theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="atmosphere"></div>

    <h1 id="logo"><span class="chip"><span class="arrow" aria-hidden="true">←</span>Nimbus</span></h1>

    <div id="top-actions">

        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" type="button">
            <span class="theme-toggle-track">
                <svg class="theme-toggle-icon moon" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
                </svg>
                <svg class="theme-toggle-icon sun" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
                    <circle cx="12" cy="12" r="5" fill="currentColor"/>
                    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </g>
                </svg>
                <span class="theme-toggle-thumb"></span>
            </span>
        </button>

        <button id="openQueueBT">
            Queue <span id="queue-badge">0</span>
        </button>

    </div>
        
    <div id="app">
        <div id="home" class="fade">
            <div id="input-bar">
                <input type="text" placeholder="Paste link here">
                <button id="startBT" aria-label="Start download">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
    </svg>
</button>
            </div>
        </div>

        <div id="results" class="fade fade-out is-hidden">
            <div id="result-scroll">
                <h2> Video Details</h2>
                <p id="report-url"></p>

                <div id="result-content">
                    <img id="thumb">
                    <div id="meta">
                        <h2 id="title"></h2>
                        <p id="dur"></p>
                    </div>
                </div>
            </div>

            <div id="footer">
                <select id="dropdown">
                    <option value="">Select Quality</option>
                </select>

                <button id="downBT">Quick Download</button>
                <button id="queueBT">Add to Queue</button>

            </div>

        </div>
    </div>
    <div id="loader" class="fade fade-out is-hidden">
            <span></span>
            <span></span>
            <span></span>
    </div>

    <div id="error-modal" hidden>
        <div id="error-card">
            <h3>Error</h3>
            <p id="error-msg">Failed to fetch metadata</p>
            <button id="error-ok"> Return </button>
        </div>
    </div>

    <div id="download-modal" class="fade fade-out is-hidden">
        <div id="download-card">
            <h3 id="download-status">Downloading</h3>

            <p id="download-percent">0%</p>

            <div id="progress-track">
                <div id="progress-fill"></div>
            </div>

            <p id="download-info">Preparing...</p>

            <button id="download-ok" disabled>OK</button>
        </div>
    </div>
    
    <div id="queue-modal" class="fade fade-out is-hidden">
        <div id="queue-card">
                <div id="queue-header">
                    <div>
                        <h3>Download Queue</h3>
                        <p id="queue-count">0 downloads</p>
                    </div>

                    <button id="queue-close">x</button>
                </div>

                <div id="queue-list"></div>

                <div id="queue-footer">
                    <button id="queue-download" disabled>
                        Download All
                    </button>
                </div>

            </div>
        </div>
    <div id="queue-toast" class="queue-toast"></div>

    <script type="module" src="editor.js"></script>
    <script type="module" src="qUI.js"></script>
    <script type="module" src="theme.js"></script>
    
</body>
